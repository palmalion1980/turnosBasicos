<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="contenedor">
        <div class="panel-lateral caja-centrada">
            <h2>Acceso</h2>
            <form method="POST">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autofocus class="campo-clave">
                <button type="submit" class="btn-guardar">Entrar</button>
            </form>
            {% if error %}<p class="msg-error">{{ error }}</p>{% endif %}
        </div>
    </div>
</body>
</html>
